
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pulsixgames - Proxy</title>

<script>
try {
    const s = JSON.parse(localStorage.getItem("bbg_settings2") || "{}");
    document.documentElement.dataset.theme = s.theme || "black";
    if (s.pulse === false) document.documentElement.classList.add("no-pulse");
    if (s.glow === false) document.documentElement.classList.add("no-glow");
} catch {}
</script>

<link rel="stylesheet" href="/styles.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    overflow: hidden;
    background: var(--night, #0a0a0a);
    color: var(--dim, #a1a1a6);
}

.bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.bg i {
    position: absolute;
    width: 40vw;
    height: 40vw;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
    background: var(--blob1, #444);
    animation: drift 26s ease-in-out infinite alternate;
}

.bg i:nth-child(2) {
    right: 0;
    bottom: 0;
    background: var(--blob2, #333);
}

.bg i:nth-child(3) {
    left: 45%;
    top: 30%;
    background: var(--blob3, #555);
}

@keyframes drift {
    to { transform: translate(8vw, 6vh) scale(1.15); }
}

.no-glow .bg i { animation: none; }

.no-pulse .bg::before,
.no-pulse .bg::after { display: none; }

aside {
    position: relative;
    z-index: 10;
    width: 250px;
    flex-shrink: 0;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--side, #111);
    border-right: 1px solid var(--line, #333);
}

.logo {
    font: 800 1.5rem/1 'Bricolage Grotesque';
    color: var(--text, white);
    padding: 4px 10px;
}

.logo small {
    display: block;
    font: 500 .75rem 'DM Sans';
    color: var(--dim, #aaa);
    margin-top: 6px;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 18px;
}

.nav button {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    padding: 10px 14px;
    border-radius: 14px;
    color: var(--dim, #aaa);
    font-size: .95rem;
    transition: .25s;
}

.nav button:hover {
    background: rgba(255,255,255,.08);
    color: var(--text, white);
    transform: translateX(5px);
}

.nav .sub {
    margin: 14px;
    font-size: .78rem;
}

.acct {
    margin-top: auto;
    border-top: 1px solid var(--line, #333);
    padding-top: 14px;
}

.me {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text, white);
    font-size: .9rem;
    font-weight: 600;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #64748b;
}

.dot.green { background: #4ade80; }

main {
    flex: 1;
    min-width: 0;
    position: relative;
    z-index: 5;
    padding: 26px clamp(16px, 3vw, 40px);
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.btn {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    text-align: center;
    padding: 11px 16px;
    border-radius: 14px;
    font-weight: 600;
    transition: .25s;
}

.btn.main {
    background: linear-gradient(135deg, var(--orange, white), var(--pink, #aaa));
    color: var(--on, black);
}

.btn.main:hover {
    transform: translateY(-2px);
}

.btn.ghost {
    background: rgba(255,255,255,.08);
    color: var(--text, white);
    width: 44px;
    padding: 11px 0;
}

.btn.ghost:hover {
    background: rgba(255,255,255,.16);
}

.btn:disabled {
    opacity: .35;
    pointer-events: none;
}

input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid var(--line, #333);
    background: rgba(255,255,255,.07);
    color: var(--text, white);
    font: 500 1rem 'DM Sans';
    min-width: 0;
}

input::placeholder { color: var(--dim, #aaa); }

.tabbar, .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
}

.tabbar { padding-right: 70px; }

.tabs {
    display: flex;
    flex: 1;
    min-width: 0;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
    flex: 0 1 190px;
    min-width: 120px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 12px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: rgba(255,255,255,.04);
    color: var(--dim, #aaa);
    font-size: .82rem;
    cursor: pointer;
    overflow: hidden;
}

.tab.on {
    background: var(--panel, #222);
    color: var(--text, white);
    border-color: var(--mint, #aaa);
}

.tab.enter {
    opacity: 0;
    transform: scale(.85);
}

.tab .ico {
    flex-shrink: 0;
}

.tab .ttl {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tab .x {
    all: unset;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 50%;
}

.tab .x:hover { background: rgba(255,255,255,.15); }

#newtab { width: 38px; padding: 8px 0; }

#addr {
    flex: 1;
    border-radius: 999px;
    padding: 13px 20px;
}

.view {
    flex: 1;
    min-height: 0;
    position: relative;
    background: var(--panel, #222);
    border: 1px solid var(--line, #333);
    border-radius: 22px;
    overflow: hidden;
}

.view iframe {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
}

.view iframe.frame--active { display: block; }

.view.busy::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 40%;
    height: 3px;
    background: var(--mint, white);
    animation: slide 1s infinite;
}

@keyframes slide {
    from { transform: translateX(-100%); }
    to { transform: translateX(250%); }
}

.home {
    position: absolute;
    inset: 0;
    display: none;
    place-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
}

.home.show { display: grid; }

.home h2 {
    font: 800 clamp(1.8rem, 4vw, 2.6rem) 'Bricolage Grotesque';
    color: var(--text, white);
}

.home p { color: var(--dim, #aaa); }

.home input {
    width: min(480px, 100%);
    margin: auto;
    border-radius: 999px;
    padding: 13px 20px;
}

.retry {
    display: none;
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    max-width: 90%;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--plum, #222);
    color: var(--text, white);
}

.retry.show { display: flex; }

@media (max-width: 820px) {
    body { flex-direction: column; }
    aside {
        width: 100%;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
    }
    .nav { flex-direction: row; flex-wrap: wrap; margin: 0; }
    .nav .sub { display: none; }
    .acct { margin: 0 0 0 auto; border: 0; }
    main { min-height: 0; padding: 14px; }
}
</style>
</head>

<body>

<div class="bg"><i></i><i></i><i></i></div>

<aside>
    <div class="logo">pulsixgames<small>proxy</small></div>

    <nav class="nav">
        <button id="back">← Back to games</button>

        <div class="sub">Quick links</div>
        <button data-go="html.duckduckgo.com/html/">DuckDuckGo</button>
        <button data-go="wikipedia.org">Wikipedia</button>
        <button data-go="news.ycombinator.com">Hacker News</button>
    </nav>

    <div class="acct">
        <div class="me">
            <span class="dot" id="status-dot"></span>
            <span id="status">Connecting...</span>
        </div>
    </div>
</aside>

<main>
    <div class="tabbar">
        <div class="tabs" id="tabs"></div>
        <button class="btn ghost" id="newtab">+</button>
    </div>

    <div class="toolbar">
        <button class="btn ghost" id="bk">←</button>
        <button class="btn ghost" id="fw">→</button>
        <button class="btn ghost" id="rl"><span class="rot">⟳</span></button>
        <input id="addr" placeholder="Search or enter a website" autocomplete="off">
        <button class="btn main" id="go">Go</button>
    </div>

    <div class="view" id="view">
        <div class="home show" id="home">
            <h2>New Tab</h2>
            <p>Search the web or enter a website address.</p>
            <input id="home-in" placeholder="Search or enter a website">
        </div>

        <div class="retry" id="retry">
            <span id="retry-msg"></span>
            <button class="btn main" id="retry-btn">Retry</button>
        </div>
    </div>
</main>

<script type="module" src="/js/pulsix-app.js"></script>

</body>
</html>
